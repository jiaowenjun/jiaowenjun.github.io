
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="个人主页与开源项目展示" />
  <title>Jiaowenjun · Projects</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #24292f;
      --text-muted: #57606a;
      --border: #d8dee4;
      --accent: #0969da;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
      }
    }

    body {
      max-width: 760px;
      margin: 80px auto;
      padding: 0 24px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      transition: background-color 0.2s, color 0.2s;
    }

    h1 { font-size: 2.2rem; }
    .project {
      display: block;
      padding: 20px;
      margin: 16px 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .project:hover { border-color: var(--accent); }
    .project h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .project p { margin: 0; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <h1>Jiaowenjun</h1>
    <p>个人主页 · 开源项目 · 技术探索</p>
  </header>

  <main>
    <h2>Projects</h2>

    <a class="project"
       href="https://jiaowenjun.github.io/weimo-ui-core/">
      <h2>weimo-ui-core ↗</h2>
      <p>维摩 UI 核心组件库</p>
    </a>

    <a class="project"
       href="https://jiaowenjun.github.io/weimo-ui-editor/">
      <h2>weimo-ui-editor ↗</h2>
      <p>维摩富文本编辑器组件</p>
    </a>

    <a class="project"
       href="https://jiaowenjun.github.io/weimo-ui-stats/">
      <h2>weimo-ui-stats ↗</h2>
      <p>维摩数据统计组件</p>
    </a>

    <a class="project"
       href="https://jiaowenjun.github.io/weimo-ui-template/">
      <h2>weimo-ui-template ↗</h2>
      <p>维摩网站模板(Site 与 MiniSite)</p>
    </a>

    <a class="project"
       href="https://jiaowenjun.github.io/weimo-ui-tagtree/">
      <h2>weimo-ui-tagtree ↗</h2>
      <p>维摩标签树与面包屑组件</p>
    </a>
  </main>
</body>
</html>
